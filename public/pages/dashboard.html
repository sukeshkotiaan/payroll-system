

  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Payroll System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
    .header {
      background: #1a73e8;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 20px; }
    .btn-logout {
      background: white;
      color: #1a73e8;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-left: 15px;
    }
    .container { padding: 30px; }
    .welcome {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .welcome h2 { color: #333; margin-bottom: 5px; }
    .welcome p { color: #666; font-size: 14px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }
    .card .icon { font-size: 36px; margin-bottom: 12px; }
    .card h3 { color: #333; font-size: 15px; margin-bottom: 5px; }
    .card p { color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🏢 Payroll System</h1>
    <div style="display:flex;align-items:center;">
      <span id="userName" style="font-size:14px;"></span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </div>

  

  <div class="container">
    <div class="welcome">
      <h2 id="welcomeMsg">Welcome!</h2>
      <p id="roleMsg">Loading...</p>
    </div>



  <!-- STATS BAR -->
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:15px;margin-bottom:25px;">
    <div style="background:white;border-radius:10px;padding:15px 10px;box-shadow:0 2px 8px rgba(0,0,0,0.08);text-align:center;border-top:3px solid #1a73e8;">
      <div style="font-size:10px;color:#666;font-weight:600;margin-bottom:5px;">TOTAL EMPLOYEES</div>
      <div id="statEmp" style="font-size:28px;font-weight:800;color:#1a73e8;">—</div>
    </div>
    <div style="background:white;border-radius:10px;padding:15px 10px;box-shadow:0 2px 8px rgba(0,0,0,0.08);text-align:center;border-top:3px solid #34a853;">
      <div style="font-size:10px;color:#666;font-weight:600;margin-bottom:5px;">PAYROLL GROUPS</div>
      <div id="statPayroll" style="font-size:28px;font-weight:800;color:#34a853;">—</div>
    </div>
    <div style="background:white;border-radius:10px;padding:15px 10px;box-shadow:0 2px 8px rgba(0,0,0,0.08);text-align:center;border-top:3px solid #fbbc04;">
      <div style="font-size:10px;color:#666;font-weight:600;margin-bottom:5px;">PENDING APPROVALS</div>
      <div id="statPending" style="font-size:28px;font-weight:800;color:#fbbc04;">—</div>
    </div>
    <div style="background:white;border-radius:10px;padding:15px 10px;box-shadow:0 2px 8px rgba(0,0,0,0.08);text-align:center;border-top:3px solid #ea4335;">
      <div style="font-size:10px;color:#666;font-weight:600;margin-bottom:5px;">ACTIVE LOANS</div>
      <div id="statLoans" style="font-size:28px;font-weight:800;color:#ea4335;">—</div>
    </div>
    <div style="background:white;border-radius:10px;padding:15px 10px;box-shadow:0 2px 8px rgba(0,0,0,0.08);text-align:center;border-top:3px solid #9c27b0;">
      <div style="font-size:10px;color:#666;font-weight:600;margin-bottom:5px;">PAYROLL PROCESSED</div>
      <div id="statProcessed" style="font-size:18px;font-weight:800;color:#9c27b0;">—</div>
    </div>
  </div>

    <div class="cards" id="menuCards"></div>
  </div>

  <script>

  async function loadDashboardStats() {
    try {
      const res = await fetch('/api/dashboard/stats');
      const data = await res.json();
      if (!data.success) return;
      const s = data.stats;
      const empEl = document.getElementById('statEmp');
      const payEl = document.getElementById('statPayroll');
      const penEl = document.getElementById('statPending');
      const loanEl = document.getElementById('statLoans');
      const procEl = document.getElementById('statProcessed');
      if (empEl) empEl.textContent = s.totalEmployees.toLocaleString('en-IN');
      if (payEl) payEl.textContent = s.payrollGroups;
      if (penEl) penEl.textContent = s.pendingAttendance;
      if (loanEl) loanEl.textContent = s.activeLoans;
      if (procEl) procEl.textContent = s.processedGroups + '/' + s.payrollGroups + ' groups';
    } catch(e) { console.error('Stats error:', e); }
  }
    const ALL_MENUS = [
      { key: 'dashboard', icon: '📊', title: 'Dashboard', desc: 'System overview', url: '/dashboard' },
      { key: 'employees', icon: '👥', title: 'Employees', desc: 'Manage employee master data', url: '/employees' },
      { key: 'exits', icon: '🚪', title: 'Exit Management', desc: 'Process employee exits', url: '/exits' },
      { key: 'attendance', icon: '📋', title: 'Attendance', desc: 'Upload monthly attendance', url: '/attendance' },
      { key: 'payroll', icon: '💰', title: 'Payroll', desc: 'Process monthly payroll', url: '/payroll' },
      
      { key: 'arrears', icon: '📊', title: 'Arrears & Advances', desc: 'Manage arrears and advances', url: '/arrears' },
      { key: 'tds', icon: '🧾', title: 'TDS Management', desc: 'Manage employee TDS deductions', url: '/tds' },
      { key: 'loans', icon: '💳', title: 'Loan Management', desc: 'Manage employee loans and EMI', url: '/loans' },
      { key: 'payroll-approval', icon: '✅', title: 'Payroll Approval', desc: 'Approve payroll', url: '/payroll-approval' },
      { key: 'payslip', icon: '🧾', title: 'Payslip', desc: 'Generate employee payslips', url: '/payslip' },
      { key: 'archive', icon: '📁', title: 'Archive', desc: 'View past payroll records', url: '/archive' },
      { key: 'reports', icon: '📈', title: 'Reports', desc: 'View payroll reports', url: '/reports' },
      { key: 'masters', icon: '📋', title: 'Masters', desc: 'Manage locations, departments', url: '/masters' },
      { key: 'settings', icon: '⚙️', title: 'Settings', desc: 'Configure payroll rules', url: '/settings' },
      { key: 'school-info', icon: '🏫', title: 'School Info', desc: 'Manage school details and logos', url: '/school-info' },
      { key: 'users', icon: '👤', title: 'User Management', desc: 'Manage system users', url: '/users' },
      { key: 'supervisor-mapping', icon: '🗂️', title: 'Supervisor Mapping', desc: 'Map employees to supervisors', url: '/supervisor-mapping' }
    ];

    window.onload = async () => {
    await loadDashboardStats();
      const res = await fetch('/api/auth/me');
      const data = await res.json();
      if (!data.success) { window.location.href = '/'; return; }
      const user = data.user;
      document.getElementById('userName').textContent = user.fullName;
      document.getElementById('welcomeMsg').textContent = 'Welcome, ' + user.fullName + '!';
      document.getElementById('roleMsg').textContent =
        'Role: ' + user.role.toUpperCase() +
        ' | Branch: ' + (user.branches ? user.branches.join(', ').toUpperCase() : 'ALL');
      await renderMenus(user);
    };

    async function renderMenus(user) {
      const container = document.getElementById('menuCards');
      let allowedKeys = [];

      if (user.role === 'admin') {
        allowedKeys = ALL_MENUS.map(m => m.key);
      } else {
        try {
          const res = await fetch('/api/masters/role');
          const data = await res.json();
          if (data.success) {
            const roleData = data.masters.find(
              r => r.value.toLowerCase() === user.role.toLowerCase()
            );
            if (roleData) allowedKeys = roleData.permissions || [];
          }
        } catch(e) {
          allowedKeys = ['dashboard'];
        }
      }

      const visibleMenus = ALL_MENUS.filter(m => allowedKeys.includes(m.key));
      container.innerHTML = visibleMenus.map(menu => `
        <div class="card" onclick="window.location.href='${menu.url}'">
          <div class="icon">${menu.icon}</div>




          <h3>${menu.title}</h3>
          <p>${menu.desc}</p>
        </div>
      `).join('');
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/';
    }
  </script>
</body>
</html>
