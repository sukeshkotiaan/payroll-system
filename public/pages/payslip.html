<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payslips — Payroll System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
    .header { background: #1a73e8; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .header h1 { font-size: 20px; }
    .btn-back { background: white; color: #1a73e8; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .view { display: none; }
    .view.active { display: block; }
    .container { padding: 20px; max-width: 1100px; margin: 0 auto; }
    .btn-primary { background: #1a73e8; color: white; border: none; padding: 9px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-success { background: #34a853; color: white; border: none; padding: 9px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-secondary { background: #f0f2f5; color: #333; border: none; padding: 9px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: visible; margin-bottom: 20px; }
    .card-header { padding: 15px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .card-header h3 { font-size: 15px; color: #333; }
    .card-body { padding: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 13px; font-weight: 600; color: #555; }
    .form-group select, .form-group input { padding: 9px 11px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; }
    .form-group select:focus, .form-group input:focus { border-color: #1a73e8; }
    .alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; display: none; }
    .alert-success { background: #e6f4ea; color: #34a853; }
    .alert-error { background: #fce8e6; color: #ea4335; }
    .empty-state { text-align: center; padding: 40px; color: #999; }
    .form-view-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #e8f0fe; }
    .btn-back-list { background: #e8f0fe; color: #1a73e8; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #f8f9fa; padding: 10px 15px; text-align: left; font-weight: 600; color: #555; border-bottom: 1px solid #eee; }
    td { padding: 10px 15px; border-bottom: 1px solid #f5f5f5; color: #333; }
    tr:hover { background: #f8f9ff; }
    .badge { padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .badge-approved { background: #e6f4ea; color: #34a853; }
    .badge-draft { background: #fef3c7; color: #d97706; }
    .badge-locked { background: #e8f0fe; color: #1a73e8; }
    .badge-pending { background: #fef3c7; color: #d97706; }
    .tab { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; background: white; color: #666; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .tab.active { background: #1a73e8; color: white; }
    .tab-section { display: none; }
    .tab-section.active { display: block; }

    /* PAYSLIP PRINT STYLES */
    @media print {
      body { background: white; }
      .header, .no-print { display: none !important; }
      .payslip-page { page-break-after: always; margin: 0 !important; box-shadow: none !important; }
      .payslip-page:last-child { page-break-after: avoid; }
    }
    .payslip-page {
      background: white; width: 100%; max-width: 750px;
      margin: 0 auto 25px; padding: 25px 30px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.1);
      border: 1px solid #e0e0e0;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 11px; color: #333;
    }
    .ps-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #1a73e8; padding-bottom: 12px; margin-bottom: 15px; }
    .ps-company { }
    .ps-company-name { font-size: 18px; font-weight: 800; color: #1a73e8; }
    .ps-company-addr { font-size: 10px; color: #666; margin-top: 2px; }
    .ps-slip-info { text-align: right; }
    .ps-slip-title { font-size: 14px; font-weight: 700; color: #333; }
    .ps-slip-month { font-size: 11px; color: #666; margin-top: 2px; }
    .ps-emp-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px 15px; background: #f8f9fa; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
    .ps-emp-item label { font-size: 9px; color: #888; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 2px; }
    .ps-emp-item span { font-size: 11px; font-weight: 600; color: #333; }
    .ps-tables { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
    .ps-table { width: 100%; border-collapse: collapse; }
    .ps-table th { background: #1a73e8; color: white; padding: 6px 10px; font-size: 11px; text-align: left; }
    .ps-table td { padding: 5px 10px; border-bottom: 1px solid #f0f0f0; font-size: 11px; }
    .ps-table td:last-child { text-align: right; font-weight: 600; }
    .ps-table tr:nth-child(even) td { background: #fafafa; }
    .ps-table .ps-total td { background: #e8f0fe; font-weight: 700; color: #1a73e8; border-top: 2px solid #1a73e8; }
    .ps-net { background: #1a73e8; color: white; padding: 12px 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .ps-net-label { font-size: 13px; font-weight: 700; }
    .ps-net-amount { font-size: 22px; font-weight: 800; }
    .ps-words { font-size: 10px; color: #555; padding: 6px 10px; background: #f8f9fa; border-radius: 4px; margin-bottom: 12px; }
    .ps-footer { display: flex; justify-content: space-between; padding-top: 10px; border-top: 1px solid #eee; font-size: 10px; color: #999; }
    .ps-sign { text-align: right; }
    .ps-sign-line { border-top: 1px solid #666; margin-top: 25px; padding-top: 3px; font-size: 10px; color: #555; }
  </style>
</head>
<body>


<!-- EMAIL MODAL -->
<div id="emailOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:2000;"></div>
<div id="emailModal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;border-radius:12px;padding:25px;width:420px;z-index:2001;box-shadow:0 8px 30px rgba(0,0,0,0.2);">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
    <h3 style="font-size:16px;color:#333;">📧 Send Payslip</h3>
    <button onclick="closeEmailModal()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#666;">×</button>
  </div>
  <div style="background:#e8f0fe;border-radius:8px;padding:10px 15px;margin-bottom:15px;font-size:13px;">
    <strong id="emailEmpName">—</strong><br>
    <span id="emailMonth" style="color:#666;font-size:12px;"></span>
  </div>
  <div style="margin-bottom:15px;">
    <label style="font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:5px;">To Email Address *</label>
    <input type="email" id="emailTo" placeholder="employee@email.com"
      style="width:100%;padding:10px;border:2px solid #1a73e8;border-radius:6px;font-size:13px;outline:none;">
  </div>
  <div style="margin-bottom:15px;">
    <label style="font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:5px;">Subject</label>
    <input type="text" id="emailSubject" placeholder="Salary Slip — June 2026"
      style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none;">
  </div>
  <div id="emailAlert" style="display:none;padding:8px 12px;border-radius:6px;margin-bottom:10px;font-size:13px;"></div>
  <div style="display:flex;gap:10px;justify-content:flex-end;">
    <button onclick="closeEmailModal()" style="background:#f0f2f5;color:#333;border:none;padding:9px 18px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;">Cancel</button>
    <button onclick="sendPayslipEmail()" style="background:#1a73e8;color:white;border:none;padding:9px 18px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;">📧 Send Email</button>
  </div>
</div>

<div class="header">
  <h1>🧾 Payslips</h1>
  <div style="display:flex;align-items:center;gap:10px;">
    <span id="headerUser" style="font-size:13px;"></span>
    <button class="btn-back" onclick="window.location.href='/dashboard'">← Dashboard</button>
  </div>
</div>

<!-- SEARCH VIEW -->
<div id="searchView" class="view active">
  <div class="container">
    <div class="alert alert-error" id="searchAlertError"></div>

    <!-- TABS -->
    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <button class="tab active" id="tabGroup" onclick="switchTab('Group')">👥 By Group</button>
      <button class="tab" id="tabEmployee" onclick="switchTab('Employee')">👤 By Employee</button>
    </div>

    <!-- TAB 1: BY GROUP -->
    <div class="tab-section active" id="sectionGroup">
      <div class="card">
        <div class="card-body">
          <div style="display:flex;gap:15px;flex-wrap:wrap;align-items:end;">
            <div class="form-group">
              <label>Month</label>
              <select id="grpMonth">
                <option value="">All Months</option>
                <option>January</option><option>February</option><option>March</option>
                <option>April</option><option>May</option><option>June</option>
                <option>July</option><option>August</option><option>September</option>
                <option>October</option><option>November</option><option>December</option>
              </select>
            </div>
            <div class="form-group">
              <label>Year</label>
              <select id="grpYear"><option value="">All Years</option></select>
            </div>
            <div class="form-group">
              <label>Location</label>
              <select id="grpLocation"><option value="">All Locations</option></select>
            </div>
            <div class="form-group" style="align-self:end;">
              <button class="btn-primary" onclick="loadPayrollList()">🔍 Search</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Payroll Records <span id="listCount" style="color:#666;font-weight:400;font-size:13px;"></span></h3>
        </div>
        <table>
          <thead>
            <tr>
              <th>Group</th><th>Month / Year</th><th>Employees</th>
              <th>Total Gross</th><th>Total Net</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="payrollList">
            <tr><td colspan="7"><div class="empty-state">Select filters and click Search</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- TAB 2: BY EMPLOYEE -->
    <div class="tab-section" id="sectionEmployee">
      <div class="card">
        <div class="card-body">
          <div style="display:flex;gap:15px;flex-wrap:wrap;align-items:end;">
            <div class="form-group">
              <label>Month *</label>
              <select id="empMonth">
                <option value="">Select Month</option>
                <option>January</option><option>February</option><option>March</option>
                <option>April</option><option>May</option><option>June</option>
                <option>July</option><option>August</option><option>September</option>
                <option>October</option><option>November</option><option>December</option>
              </select>
            </div>
            <div class="form-group">
              <label>Year *</label>
              <select id="empYear"><option value="">Select Year</option></select>
            </div>
            <div class="form-group">
              <label>EIN *</label>
              <input type="text" id="empEIN" placeholder="e.g. STT-1001"
                style="text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()"
                onkeypress="if(event.key==='Enter') searchEmployeePayslip()">
            </div>
            <div class="form-group" style="align-self:end;">
              <button class="btn-primary" onclick="searchEmployeePayslip()">🔍 Generate Payslip</button>
            </div>
          </div>
        </div>
      </div>
      <div id="empPayslipContainer"></div>
    </div>
  </div>
</div>

<!-- GROUP PAYSLIP VIEW -->
<div id="payslipView" class="view">
  <div class="container">
    <div class="form-view-header no-print">
      <button class="btn-back-list" onclick="showSearchView()">← Back</button>
      <h2 id="payslipTitle">Payslips</h2>
      <div style="display:flex;gap:10px;margin-left:auto;align-items:center;">
        <input type="text" id="empSearch" placeholder="Search EIN or Name..."
          style="padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none;width:200px;"
          oninput="filterPayslips()">
        <span id="payslipCount" style="font-size:13px;color:#666;"></span>
        <button class="btn-success" onclick="window.print()">🖨️ Print All</button>
      </div>
    </div>
    <div id="payslipsContainer"></div>
  </div>
</div>

<script>

  let emailPayslipData = null;

  function openEmailModal(btn) {
    const ein = btn.dataset.ein;
    const name = btn.dataset.name;
    const month = btn.dataset.month;
    const year = btn.dataset.year;
    const empEmail = '';
    emailPayslipData = { ein, name, month, year };
    document.getElementById('emailEmpName').textContent = name + ' (' + ein + ')';
    document.getElementById('emailMonth').textContent = 'Salary Slip for ' + month + ' ' + year;
    document.getElementById('emailTo').value = empEmail || '';
    document.getElementById('emailSubject').value = 'Salary Slip — ' + month + ' ' + year;
    document.getElementById('emailAlert').style.display = 'none';
    document.getElementById('emailOverlay').style.display = 'block';
    document.getElementById('emailModal').style.display = 'block';
    document.getElementById('emailTo').focus();
  }

  function closeEmailModal() {
    document.getElementById('emailOverlay').style.display = 'none';
    document.getElementById('emailModal').style.display = 'none';
    emailPayslipData = null;
  }

  async function sendPayslipEmail() {
    const to = document.getElementById('emailTo').value.trim();
    const subject = document.getElementById('emailSubject').value.trim();
    if (!to) { showEmailAlert('Please enter email address', 'error'); return; }
    if (!emailPayslipData) return;
    const slipEl = document.getElementById('slip-' + emailPayslipData.ein);
    if (!slipEl) { showEmailAlert('Payslip not found', 'error'); return; }
    const html = slipEl.outerHTML;
    try {
      showEmailAlert('Sending...', 'info');
      const res = await fetch('/api/email/send-payslip', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          to, subject, html,
          employeeName: emailPayslipData.name,
          month: emailPayslipData.month,
          year: emailPayslipData.year
        })
      });
      const data = await res.json();
      if (data.success) {
        showEmailAlert('✅ ' + data.message, 'success');
        setTimeout(closeEmailModal, 2000);
      } else {
        showEmailAlert('❌ ' + data.message, 'error');
      }
    } catch(e) { showEmailAlert('Error: ' + e.message, 'error'); }
  }

  function showEmailAlert(msg, type) {
    const el = document.getElementById('emailAlert');
    el.textContent = msg;
    el.style.display = 'block';
    el.style.background = type === 'success' ? '#e6f4ea' : type === 'error' ? '#fce8e6' : '#e8f0fe';
    el.style.color = type === 'success' ? '#34a853' : type === 'error' ? '#ea4335' : '#1a73e8';
  }

  let currentUser = {};
  let currentPayroll = null;
  const MONTHS = ['January','February','March','April','May','June',
    'July','August','September','October','November','December'];

  window.onload = async () => {
    attachEINSearch('empEIN', function(emp) {
      document.getElementById('empEIN').value = emp.ein;
    });
    await checkAuth();
    await loadLocations();
    populateYears();
    setDefaults();
    await loadPayrollList();
  };

  async function checkAuth() {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    if (!data.success) { window.location.href = '/'; return; }
    currentUser = data.user;
    document.getElementById('headerUser').textContent = data.user.fullName;
  }

  async function loadLocations() {
    try {
      const res = await fetch('/api/masters/location');
      const data = await res.json();
      if (data.success) {
        const el = document.getElementById('grpLocation');
        el.innerHTML = '<option value="">All Locations</option>';
        data.masters.forEach(m => { el.innerHTML += '<option value="' + m.value + '">' + m.value + '</option>'; });
      }
    } catch(e) {}
  }

  function populateYears() {
    const now = new Date().getFullYear();
    ['grpYear','empYear'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.innerHTML = '<option value="">All Years</option>';
      for (let y = now + 1; y >= now - 3; y--) {
        el.innerHTML += '<option value="' + y + '">' + y + '</option>';
      }
    });
  }

  function setDefaults() {
    const now = new Date();
    document.getElementById('grpMonth').value = MONTHS[now.getMonth()];
    document.getElementById('grpYear').value = now.getFullYear();
    document.getElementById('empMonth').value = MONTHS[now.getMonth()];
    document.getElementById('empYear').value = now.getFullYear();
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
    document.getElementById('tab' + tab).classList.add('active');
    document.getElementById('section' + tab).classList.add('active');
  }

  async function loadPayrollList() {
    try {
      const month = document.getElementById('grpMonth').value;
      const year = document.getElementById('grpYear').value;
      const location = document.getElementById('grpLocation').value;
      let url = '/api/payroll?';
      if (month) url += 'month=' + month + '&';
      if (year) url += 'year=' + year + '&';
      if (location) url += 'location=' + location + '&';
      const res = await fetch(url);
      const data = await res.json();
      if (data.success) renderList(data.records);
    } catch(e) {}
  }

  function renderList(records) {
    const tbody = document.getElementById('payrollList');
    document.getElementById('listCount').textContent = '(' + records.length + ' records)';
    if (!records.length) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state">No payroll records found</div></td></tr>';
      return;
    }
    tbody.innerHTML = records.map(r => '<tr>' +
      '<td><strong>' + (r.groupName || r.section + ' ' + r.location) + '</strong></td>' +
      '<td>' + r.month + ' ' + r.year + '</td>' +
      '<td>' + (r.records ? r.records.length : '—') + '</td>' +
      '<td>₹' + formatNum(r.totalGross) + '</td>' +
      '<td>₹' + formatNum(r.totalNet) + '</td>' +
      '<td><span class="badge badge-' + r.status.toLowerCase() + '">' + r.status + '</span></td>' +
      '<td><button class="btn-primary" style="padding:6px 12px;font-size:12px;" onclick="viewGroupPayslips(\'' + r._id + '\')">🧾 View Payslips</button></td>' +
      '</tr>'
    ).join('');
  }

  async function viewGroupPayslips(id) {
    try {
      const res = await fetch('/api/payroll/' + id);
      const data = await res.json();
      if (!data.success) return;
      currentPayroll = data.payroll;
      document.getElementById('payslipTitle').textContent =
        currentPayroll.groupName + ' — ' + currentPayroll.month + ' ' + currentPayroll.year;
      document.getElementById('empSearch').value = '';
      document.getElementById('payslipCount').textContent = currentPayroll.records.length + ' payslips';
      renderPayslips(currentPayroll.records, 'payslipsContainer');
      switchView('payslipView');
    } catch(e) { console.error(e); }
  }

  function filterPayslips() {
    if (!currentPayroll) return;
    const search = document.getElementById('empSearch').value.toLowerCase();
    const filtered = search ? currentPayroll.records.filter(r =>
      (r.ein && r.ein.toLowerCase().includes(search)) ||
      (r.employeeName && r.employeeName.toLowerCase().includes(search))
    ) : currentPayroll.records;
    document.getElementById('payslipCount').textContent = filtered.length + ' payslips';
    renderPayslips(filtered, 'payslipsContainer');
  }

  async function searchEmployeePayslip() {
    const month = document.getElementById('empMonth').value;
    const year = document.getElementById('empYear').value;
    const ein = document.getElementById('empEIN').value.trim().toUpperCase();
    if (!month || !year || !ein) {
      alert('Please select Month, Year and enter EIN');
      return;
    }
    try {
      // Search across all payroll records for this month/year
      const res = await fetch('/api/payroll?month=' + encodeURIComponent(month) + '&year=' + year);
      const data = await res.json();
      if (!data.success) { alert('No payroll found'); return; }
      let found = null;
      let foundPayroll = null;
      for (const rec of data.records) {
        const detail = await fetch('/api/payroll/' + rec._id);
        const detailData = await detail.json();
        if (detailData.success) {
          const empRec = detailData.payroll.records.find(r => r.ein === ein);
          if (empRec) { found = empRec; foundPayroll = detailData.payroll; break; }
        }
      }
      if (!found) {
        document.getElementById('empPayslipContainer').innerHTML =
          '<div class="card"><div class="card-body"><div class="empty-state">No payslip found for ' + ein + ' in ' + month + ' ' + year + '</div></div></div>';
        return;
      }
      currentPayroll = foundPayroll;
      renderPayslips([found], 'empPayslipContainer');
    } catch(e) { alert('Error: ' + e.message); }
  }

  function renderPayslips(records, containerId) {
    const container = document.getElementById(containerId);
    if (!records.length) { container.innerHTML = '<div class="empty-state">No payslips</div>'; return; }
    const month = currentPayroll.month;
    const year = currentPayroll.year;
    const section = currentPayroll.section || '';

    container.innerHTML = records.map(function(r) {
      const isGlobal = r.section === 'Global' || section === 'Global';
      const logo = isGlobal ? GLOBAL_LOGO : STATE_LOGO;
      const schoolName = isGlobal ? "St. Xavier's Global Academy" : "St. Xaviers' English High School & Jr. College";
      const society = isGlobal ? '' : "Rammurti Education Society's";
      const address = isGlobal ? 'Panvel, Maharashtra' : 'Rai Master Campus, Chitalsar Manpada, Thane (W)';

      return '<div class="payslip-page" id="slip-' + r.ein + '">' +
        '<div class="ps-header">' +
        '<div style="display:flex;align-items:center;gap:15px;">' +
        '<img src="' + logo + '" style="width:70px;height:70px;object-fit:contain;">' +
        '<div>' +
        (society ? '<div style="font-size:11px;color:#555;font-weight:600;">' + society + '</div>' : '') +
        '<div style="font-size:16px;font-weight:800;color:#1a1a1a;">' + schoolName + '</div>' +
        '<div style="font-size:10px;color:#666;margin-top:2px;">' + address + '</div>' +
        '</div></div>' +
        '<div style="text-align:right;">' +
        '<div style="font-size:14px;font-weight:700;color:#333;border:1px solid #333;padding:4px 12px;border-radius:4px;">SALARY SLIP</div>' +
        '<div style="font-size:11px;color:#666;margin-top:4px;">' + month + ' ' + year + '</div>' +
        '</div></div>' +
        '<div style="margin-bottom:10px;border:1px solid #ddd;border-radius:4px;padding:10px 12px;">' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px;">' +
        '<div><span style="font-weight:600;">Employee Name</span> : ' + r.employeeName + '</div>' +
        '<div><span style="font-weight:600;">EIN</span> : ' + (r.ein||'—') + '</div>' +
        '<div><span style="font-weight:600;">Designation</span> : ' + (r.designation||'—') + '</div>' +
        '<div><span style="font-weight:600;">Section</span> : ' + (r.section||'—') + '</div>' +
        '<div><span style="font-weight:600;">Month & Year</span> : ' + month + ' ' + year + '</div>' +
        '<div><span style="font-weight:600;">Department</span> : ' + (r.department||'—') + '</div>' +
        '</div></div>' +
        '<div style="background:#f0f0f0;padding:6px 12px;display:flex;justify-content:space-between;font-size:11px;font-weight:700;border:1px solid #ddd;border-bottom:none;">' +
        '<span>Gross Salary: Rs ' + formatNum(r.monthlySalary) + ' /-</span>' +
        '<span>No of Days: ' + (r.daysInMonth||30) + '</span>' +
        '<span>Days Present: ' + (r.presentDays||0) + (r.lopDays > 0 ? ' (LOP: ' + r.lopDays + ')' : '') + '</span>' +
        '</div>' +
        '<table style="width:100%;border-collapse:collapse;font-size:11px;border:1px solid #ddd;">' +
        '<thead><tr style="background:#1a73e8;color:white;">' +
        '<th style="padding:6px 10px;text-align:left;width:30%;">Earnings</th>' +
        '<th style="padding:6px 10px;text-align:right;width:20%;">Amt in Rs</th>' +
        '<th style="padding:6px 10px;text-align:left;width:30%;">Deductions</th>' +
        '<th style="padding:6px 10px;text-align:right;width:20%;">Amt in Rs</th>' +
        '</tr></thead><tbody>' +
        '<tr style="border-bottom:1px solid #eee;">' +
        '<td style="padding:5px 10px;">Basic & DA</td><td style="padding:5px 10px;text-align:right;">Rs ' + formatNum(r.basic) + '</td>' +
        '<td style="padding:5px 10px;">Provident Fund</td><td style="padding:5px 10px;text-align:right;">Rs ' + formatNum(r.pfDeduction) + '</td>' +
        '</tr>' +
        '<tr style="border-bottom:1px solid #eee;background:#fafafa;">' +
        '<td style="padding:5px 10px;">HRA</td><td style="padding:5px 10px;text-align:right;">Rs ' + formatNum(r.hra) + '</td>' +
        '<td style="padding:5px 10px;">Professional Tax</td><td style="padding:5px 10px;text-align:right;">Rs ' + formatNum(r.ptDeduction) + '</td>' +
        '</tr>' +
        '<tr style="border-bottom:1px solid #eee;">' +
        '<td style="padding:5px 10px;">Overtime Allowance</td><td style="padding:5px 10px;text-align:right;">' + (r.otAmount > 0 ? 'Rs ' + formatNum(r.otAmount) : '—') + '</td>' +
        '<td style="padding:5px 10px;">ESIC</td><td style="padding:5px 10px;text-align:right;">Rs ' + formatNum(r.esicDeduction) + '</td>' +
        '</tr>' +
        '<tr style="border-bottom:1px solid #eee;background:#fafafa;">' +
        '<td style="padding:5px 10px;">' + (r.arrear > 0 ? 'Arrear' : '') + '</td><td style="padding:5px 10px;text-align:right;">' + (r.arrear > 0 ? 'Rs ' + formatNum(r.arrear) : '—') + '</td>' +
        '<td style="padding:5px 10px;">TDS</td><td style="padding:5px 10px;text-align:right;">Rs ' + formatNum(r.tdsDeduction) + '</td>' +
        '</tr>' +
        '<tr style="border-bottom:1px solid #eee;">' +
        '<td style="padding:5px 10px;"></td><td style="padding:5px 10px;"></td>' +
        '<td style="padding:5px 10px;">Advance / Loan EMI</td><td style="padding:5px 10px;text-align:right;">' + (r.advance > 0 ? 'Rs ' + formatNum(r.advance) : '—') + '</td>' +
        '</tr>' +
        '<tr style="background:#e8f0fe;font-weight:700;border-top:2px solid #1a73e8;">' +
        '<td style="padding:6px 10px;">Total Addition</td><td style="padding:6px 10px;text-align:right;">Rs ' + formatNum(r.grossSalary) + '</td>' +
        '<td style="padding:6px 10px;">Total Deduction</td><td style="padding:6px 10px;text-align:right;">Rs ' + formatNum(r.totalDeductions) + '</td>' +
        '</tr>' +
        '<tr style="background:#1a73e8;color:white;font-weight:700;">' +
        '<td colspan="2" style="padding:8px 10px;"></td>' +
        '<td style="padding:8px 10px;">Net Pay</td>' +
        '<td style="padding:8px 10px;text-align:right;font-size:13px;">Rs ' + formatNum(r.netSalary) + '</td>' +
        '</tr></tbody></table>' +
        '<div style="font-size:10px;padding:6px 10px;border:1px solid #ddd;border-top:none;background:#fffef0;">' +
        '<strong>Amount in Words:</strong> ' + (r.netSalary < 0 ? 'Minus ' : '') + numberToWords(Math.abs(Math.round(r.netSalary||0))) + ' Rupees Only' +
        '</div>' +
        '<div style="display:flex;justify-content:space-between;margin-top:25px;font-size:10px;color:#555;">' +
        '<div style="text-align:center;"><div style="height:30px;border-bottom:1px solid #333;width:150px;"></div><div style="margin-top:4px;">Signature of Employer</div></div>' +
        '<div style="text-align:center;"><div style="height:30px;border-bottom:1px solid #333;width:150px;"></div><div style="margin-top:4px;">Signature of Employee</div></div>' +
        '</div>' +
        '<div style="font-size:9px;color:#999;margin-top:8px;text-align:center;font-style:italic;">Salary is subject to change depending on working days of employee.</div>' +
        '<div class="no-print" style="text-align:right;margin-top:10px;">' +
        '<button onclick="openEmailModal(this)" data-ein="' + r.ein + '" data-name="' + r.employeeName + '" data-month="' + month + '" data-year="' + year + '" ' +
        'style="background:#1a73e8;color:white;border:none;padding:7px 16px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;">📧 Send Email</button>' +
        '</div></div>';
    }).join('');
  }

  function numberToWords(num) {
    if (!num || num === 0) return 'Zero';
    const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine',
      'Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
    const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
    let words = '';
    if (Math.floor(num/100000) > 0) { words += numberToWords(Math.floor(num/100000)) + ' Lakh '; num %= 100000; }
    if (Math.floor(num/1000) > 0) { words += numberToWords(Math.floor(num/1000)) + ' Thousand '; num %= 1000; }
    if (Math.floor(num/100) > 0) { words += numberToWords(Math.floor(num/100)) + ' Hundred '; num %= 100; }
    if (num > 0) { words += num < 20 ? ones[num] : tens[Math.floor(num/10)] + (num%10 ? ' '+ones[num%10] : ''); }
    return words.trim();
  }

  function formatNum(n) {
    if (!n && n !== 0) return '0.00';
    return parseFloat(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function showSearchView() { switchView('searchView'); }
  function switchView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
  }
</script>
