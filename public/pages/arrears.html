<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrears & Advances — Payroll System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
    .header { background: #1a73e8; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .header h1 { font-size: 20px; }
    .btn-back { background: white; color: #1a73e8; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .view { display: none; }
    .view.active { display: block; }
    .container { padding: 20px; max-width: 1100px; margin: 0 auto; }
    .btn-primary { background: #1a73e8; color: white; border: none; padding: 9px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-secondary { background: #f0f2f5; color: #333; border: none; padding: 9px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-danger { background: #ea4335; color: white; border: none; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .btn-warning { background: #fbbc04; color: #333; border: none; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: visible; margin-bottom: 20px; }
    .card-header { padding: 15px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .card-header h3 { font-size: 15px; color: #333; }
    .card-body { padding: 20px; overflow: visible; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 13px; font-weight: 600; color: #555; }
    .form-group select, .form-group input { padding: 9px 11px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; }
    .form-group select:focus, .form-group input:focus { border-color: #1a73e8; }
    .alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; display: none; }
    .alert-success { background: #e6f4ea; color: #34a853; }
    .alert-error { background: #fce8e6; color: #ea4335; }
    .empty-state { text-align: center; padding: 40px; color: #999; }
    .form-view-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #e8f0fe; }
    .btn-back-list { background: #e8f0fe; color: #1a73e8; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #f8f9fa; padding: 12px 15px; text-align: left; font-weight: 600; color: #555; border-bottom: 1px solid #eee; }
    td { padding: 12px 15px; border-bottom: 1px solid #f5f5f5; color: #333; }
    tr:hover { background: #f8f9ff; }
    .badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-pending { background: #fef3c7; color: #d97706; }
    .badge-pulled { background: #e6f4ea; color: #34a853; }
    .emp-info-bar { background: #e8f0fe; border-radius: 8px; padding: 12px 15px; display: grid; grid-template-columns: repeat(4,1fr); gap: 15px; margin-bottom: 15px; }
    .emp-info-item label { font-size: 11px; color: #666; font-weight: 600; display: block; }
    .emp-info-item span { font-size: 13px; font-weight: 700; color: #1a73e8; }
    .tab { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; background: white; color: #666; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .tab.active { background: #1a73e8; color: white; }
    .tab-section { display: none; }
    .tab-section.active { display: block; }
    .form-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 25px; overflow: visible; }
  </style>
</head>
<body>

<div class="header">
  <h1>📊 Arrears & Advances</h1>
  <div style="display:flex;align-items:center;gap:10px;">
    <span id="headerUser" style="font-size:13px;"></span>
    <button class="btn-back" onclick="window.location.href='/dashboard'">← Dashboard</button>
  </div>
</div>

<!-- LIST VIEW -->
<div id="listView" class="view active">
  <div class="container">
    <div class="alert alert-success" id="listAlertSuccess"></div>
    <div class="alert alert-error" id="listAlertError"></div>

    <!-- TABS -->
    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <button class="tab active" id="tabList" onclick="switchArrearTab('List')">📋 All Arrears</button>
      <button class="tab" id="tabMonthly" onclick="switchArrearTab('Monthly')">📅 Monthly View</button>
    </div>

    <!-- TAB 1: ALL ARREARS -->
    <div class="tab-section active" id="sectionList">
      <div class="card">
        <div class="card-body">
          <div style="display:flex;gap:15px;flex-wrap:wrap;align-items:end;">
            <div class="form-group">
              <label>Location</label>
              <select id="filterLocation" onchange="loadArrears()">
                <option value="">All Locations</option>
              </select>
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="filterStatus" onchange="loadArrears()">
                <option value="">All</option>
                <option value="false">Pending</option>
                <option value="true">Pulled to Payroll</option>
              </select>
            </div>
            <div class="form-group">
              <label>Search EIN / Name</label>
              <input type="text" id="filterSearch" placeholder="Type to filter..." oninput="filterTable()">
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <h3>Arrears <span id="listCount" style="color:#666;font-weight:400;font-size:13px;"></span></h3>
          <button class="btn-primary" onclick="showAddView()">+ Add Arrear</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>EIN</th><th>Name</th><th>Type</th><th>Amount</th>
              <th>Month</th><th>Remarks</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="arrearList">
            <tr><td colspan="8"><div class="empty-state">Loading...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- TAB 2: MONTHLY VIEW -->
    <div class="tab-section" id="sectionMonthly">
      <div class="card">
        <div class="card-body">
          <div style="display:flex;gap:15px;flex-wrap:wrap;align-items:end;">
            <div class="form-group">
              <label>Month *</label>
              <select id="arrMonthly">
                <option value="">Select Month</option>
                <option>January</option><option>February</option><option>March</option>
                <option>April</option><option>May</option><option>June</option>
                <option>July</option><option>August</option><option>September</option>
                <option>October</option><option>November</option><option>December</option>
              </select>
            </div>
            <div class="form-group">
              <label>Year *</label>
              <select id="arrYearly"></select>
            </div>
            <div class="form-group">
              <label>Location</label>
              <select id="arrLocation"><option value="">All Locations</option></select>
            </div>
            <div class="form-group" style="align-self:end;">
              <button class="btn-primary" onclick="loadMonthlyArrears()">📋 Load</button>
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <h3 id="arrMonthlyTitle">Monthly Arrears</h3>
          <div style="display:flex;gap:10px;align-items:center;">
            <span id="arrMonthlyInfo" style="font-size:13px;color:#666;"></span>
            <button class="btn-primary" onclick="showAddView()" id="addFromMonthly" style="display:none;">+ Add Arrear</button>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>EIN</th><th>Name</th><th>Type</th><th>Amount</th>
              <th>Remarks</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="arrMonthlyTable">
            <tr><td colspan="7"><div class="empty-state">Select month and year then click Load</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ADD VIEW -->
<div id="formView" class="view">
  <div class="container">
    <div class="form-view-header">
      <button class="btn-back-list" onclick="showListView()">← Back to List</button>
      <h2>Add Arrear / Advance</h2>
    </div>
    <div class="alert alert-success" id="formAlertSuccess"></div>
    <div class="alert alert-error" id="formAlertError"></div>

    <!-- SEARCH -->
    <div class="card">
      <div class="card-header"><h3>🔍 Search Employee</h3></div>
      <div class="card-body">
        <div style="display:flex;gap:10px;margin-bottom:15px;">
          <input type="text" id="einSearch" placeholder="Enter EIN or Name"
            style="flex:1;max-width:350px;padding:10px;border:2px solid #1a73e8;border-radius:6px;font-size:13px;outline:none;"
            onkeypress="if(event.key==='Enter') searchEmployee()">
          <button class="btn-primary" onclick="searchEmployee()">🔍 Search</button>
        </div>
        <div id="empInfoBar" style="display:none;">
          <div class="emp-info-bar">
            <div class="emp-info-item"><label>EIN</label><span id="infoEIN">—</span></div>
            <div class="emp-info-item"><label>Name</label><span id="infoName">—</span></div>
            <div class="emp-info-item"><label>Designation</label><span id="infoDesig">—</span></div>
            <div class="emp-info-item"><label>Location</label><span id="infoLoc">—</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- FORM -->
    <div class="card" id="arrearFormCard" style="display:none;overflow:visible;">
      <div class="card-header"><h3>Arrear Details</h3></div>
      <div class="card-body">
        <input type="hidden" id="empId">
        <input type="hidden" id="empEIN">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:15px;">
          <div class="form-group">
            <label>Type *</label>
            <select id="arrearType">
              <option value="">Select Type</option>
              <option>Arrear</option>
              <option>Bonus</option>
              <option>Leave Encashment</option>
              <option>Festival Advance</option>
              <option>Salary Advance</option>
              <option>Other Advance</option>
            </select>
          </div>
          <div class="form-group">
            <label>Amount (₹) *</label>
            <input type="number" id="arrearAmount" placeholder="e.g. 5000" min="0">
          </div>
          <div class="form-group">
            <label>Month *</label>
            <select id="arrearMonth">
              <option value="">Select Month</option>
              <option>January</option><option>February</option><option>March</option>
              <option>April</option><option>May</option><option>June</option>
              <option>July</option><option>August</option><option>September</option>
              <option>October</option><option>November</option><option>December</option>
            </select>
          </div>
          <div class="form-group">
            <label>Year *</label>
            <select id="arrearYear"></select>
          </div>
          <div class="form-group" style="grid-column:1/-1;">
            <label>Remarks</label>
            <input type="text" id="arrearRemarks" placeholder="e.g. Diwali bonus">
          </div>
        </div>
        <div style="margin-top:20px;display:flex;gap:10px;justify-content:flex-end;">
          <button class="btn-secondary" onclick="showListView()">Cancel</button>
          <button class="btn-primary" onclick="saveArrear()">💾 Save</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  let currentUser = {};
  let allArrears = [];
  let currentEmployee = null;

  const MONTHS = ['January','February','March','April','May','June',
    'July','August','September','October','November','December'];

  window.onload = async () => {
    await checkAuth();
    await loadLocations();
    populateYears();
    setDefaults();
    await loadArrears();
    attachEINSearch('einSearch', function(emp) {
      currentEmployee = emp;
      document.getElementById('empId').value = emp._id;
      document.getElementById('empEIN').value = emp.ein;
      document.getElementById('infoEIN').textContent = emp.ein;
      document.getElementById('infoName').textContent = emp.employeeName;
      document.getElementById('infoDesig').textContent = emp.designation || '—';
      document.getElementById('infoLoc').textContent = emp.location;
      document.getElementById('empInfoBar').style.display = 'block';
      document.getElementById('arrearFormCard').style.display = 'block';
    });
  };

  async function checkAuth() {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    if (!data.success) { window.location.href = '/'; return; }
    currentUser = data.user;
    document.getElementById('headerUser').textContent = data.user.fullName;
  }

  async function loadLocations() {
    try {
      const res = await fetch('/api/masters/location');
      const data = await res.json();
      if (data.success) {
        ['filterLocation','arrLocation'].forEach(id => {
          const el = document.getElementById(id);
          if (!el) return;
          el.innerHTML = '<option value="">All Locations</option>';
          data.masters.forEach(m => { el.innerHTML += '<option value="' + m.value + '">' + m.value + '</option>'; });
        });
      }
    } catch(e) {}
  }

  function populateYears() {
    const now = new Date().getFullYear();
    ['arrearYear','arrYearly'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.innerHTML = '<option value="">Select Year</option>';
      for (let y = now + 1; y >= now - 3; y--) {
        el.innerHTML += '<option value="' + y + '"' + (y === now ? ' selected' : '') + '>' + y + '</option>';
      }
    });
  }

  function setDefaults() {
    const now = new Date();
    const am = document.getElementById('arrearMonth');
    const mm = document.getElementById('arrMonthly');
    if (am) am.value = MONTHS[now.getMonth()];
    if (mm) mm.value = MONTHS[now.getMonth()];
    const ay = document.getElementById('arrYearly');
    if (ay) ay.value = now.getFullYear();
  }

  function switchArrearTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
    document.getElementById('tab' + tab).classList.add('active');
    document.getElementById('section' + tab).classList.add('active');
  }

  async function loadArrears() {
    try {
      const location = document.getElementById('filterLocation').value;
      const status = document.getElementById('filterStatus').value;
      let url = '/api/arrears?';
      if (location) url += 'location=' + encodeURIComponent(location) + '&';
      if (status !== '') url += 'pulledToPayroll=' + status + '&';
      const res = await fetch(url);
      const data = await res.json();
      if (data.success) { allArrears = data.arrears; filterTable(); }
    } catch(e) {}
  }

  function filterTable() {
    const search = document.getElementById('filterSearch').value.toLowerCase();
    const filtered = search ? allArrears.filter(a =>
      (a.ein && a.ein.toLowerCase().includes(search)) ||
      (a.employeeName && a.employeeName.toLowerCase().includes(search))
    ) : allArrears;
    renderList(filtered);
  }

  function renderList(arrears) {
    const tbody = document.getElementById('arrearList');
    document.getElementById('listCount').textContent = '(' + arrears.length + ' records)';
    if (!arrears.length) {
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state">No arrears found</div></td></tr>';
      return;
    }
    tbody.innerHTML = arrears.map(a => '<tr>' +
      '<td><strong>' + a.ein + '</strong></td>' +
      '<td>' + a.employeeName + '</td>' +
      '<td>' + a.type + '</td>' +
      '<td><strong style="color:#1a73e8;">₹' + (a.amount||0).toLocaleString('en-IN') + '</strong></td>' +
      '<td>' + (a.month||'—') + ' ' + (a.year||'') + '</td>' +
      '<td>' + (a.remarks||'—') + '</td>' +
      '<td><span class="badge badge-' + (a.pulledToPayroll ? 'pulled' : 'pending') + '">' + (a.pulledToPayroll ? 'Pulled' : 'Pending') + '</span></td>' +
      '<td>' + (!a.pulledToPayroll ? '<button class="btn-danger" onclick="deleteArrear(\'' + a._id + '\')">Delete</button>' : '—') + '</td>' +
      '</tr>'
    ).join('');
  }

  async function loadMonthlyArrears() {
    const month = document.getElementById('arrMonthly').value;
    const year = document.getElementById('arrYearly').value;
    const location = document.getElementById('arrLocation').value;
    if (!month || !year) { alert('Please select month and year'); return; }
    try {
      let url = '/api/arrears?month=' + encodeURIComponent(month) + '&year=' + year;
      if (location) url += '&location=' + encodeURIComponent(location);
      const res = await fetch(url);
      const data = await res.json();
      if (!data.success) return;
      const records = data.arrears;
      const total = records.reduce((s,r) => s + (r.amount||0), 0);
      document.getElementById('arrMonthlyTitle').textContent = 'Arrears — ' + month + ' ' + year;
      document.getElementById('arrMonthlyInfo').textContent = records.length + ' entries | Total: ₹' + total.toLocaleString('en-IN');
      document.getElementById('addFromMonthly').style.display = 'inline-block';
      const tbody = document.getElementById('arrMonthlyTable');
      if (!records.length) {
        tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state">No arrears for ' + month + ' ' + year + '. Click + Add Arrear.</div></td></tr>';
        return;
      }
      tbody.innerHTML = records.map(r => '<tr>' +
        '<td><strong>' + r.ein + '</strong></td>' +
        '<td>' + r.employeeName + '</td>' +
        '<td>' + r.type + '</td>' +
        '<td><strong style="color:#1a73e8;">₹' + (r.amount||0).toLocaleString('en-IN') + '</strong></td>' +
        '<td>' + (r.remarks||'—') + '</td>' +
        '<td><span class="badge badge-' + (r.pulledToPayroll ? 'pulled' : 'pending') + '">' + (r.pulledToPayroll ? 'Pulled' : 'Pending') + '</span></td>' +
        '<td>' + (!r.pulledToPayroll ? '<button class="btn-danger" style="font-size:11px;padding:4px 10px;" onclick="deleteArrear(\'' + r._id + '\')">Delete</button>' : '—') + '</td>' +
        '</tr>'
      ).join('');
    } catch(e) { console.error(e); }
  }

  async function searchEmployee() {
    const search = document.getElementById('einSearch').value.trim();
    if (!search) { showFormAlert('formAlertError', 'Please enter EIN or Name'); return; }
    try {
      const res = await fetch('/api/tds/find-employee/' + encodeURIComponent(search));
      const data = await res.json();
      if (data.success) {
        currentEmployee = data.employee;
        document.getElementById('empId').value = data.employee._id;
        document.getElementById('empEIN').value = data.employee.ein;
        document.getElementById('infoEIN').textContent = data.employee.ein;
        document.getElementById('infoName').textContent = data.employee.employeeName;
        document.getElementById('infoDesig').textContent = data.employee.designation || '—';
        document.getElementById('infoLoc').textContent = data.employee.location;
        document.getElementById('empInfoBar').style.display = 'block';
        document.getElementById('arrearFormCard').style.display = 'block';
      } else { showFormAlert('formAlertError', data.message); }
    } catch(e) { showFormAlert('formAlertError', 'Error: ' + e.message); }
  }

  async function saveArrear() {
    const empId = document.getElementById('empId').value;
    const ein = document.getElementById('empEIN').value;
    const type = document.getElementById('arrearType').value;
    const amount = document.getElementById('arrearAmount').value;
    const month = document.getElementById('arrearMonth').value;
    const year = document.getElementById('arrearYear').value;
    const remarks = document.getElementById('arrearRemarks').value;
    if (!empId || !type || !amount || !month || !year) {
      showFormAlert('formAlertError', 'Please fill all required fields'); return;
    }
    try {
      const emp = currentEmployee || {};
      const res = await fetch('/api/arrears', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          employeeId: empId, ein,
          employeeName: emp.employeeName || '',
          location: emp.location || '',
          section: emp.section || '',
          profile: emp.profile || '',
          type, amount: parseFloat(amount),
          month, year: parseInt(year), remarks
        })
      });
      const data = await res.json();
      if (data.success) {
        showFormAlert('formAlertSuccess', '✅ ' + data.message);
        await loadArrears();
        setTimeout(showListView, 1500);
      } else { showFormAlert('formAlertError', data.message); }
    } catch(e) { showFormAlert('formAlertError', 'Error: ' + e.message); }
  }

  async function deleteArrear(id) {
    if (!confirm('Delete this arrear entry?')) return;
    try {
      const res = await fetch('/api/arrears/' + id, { method: 'DELETE', credentials: 'include' });
      const data = await res.json();
      if (data.success) {
        showListAlert('listAlertSuccess', data.message);
        await loadArrears();
        await loadMonthlyArrears();
      } else { showListAlert('listAlertError', data.message); }
    } catch(e) {}
  }

  function showAddView() {
    document.getElementById('einSearch').value = '';
    document.getElementById('empInfoBar').style.display = 'none';
    document.getElementById('arrearFormCard').style.display = 'none';
    document.getElementById('arrearType').value = '';
    document.getElementById('arrearAmount').value = '';
    document.getElementById('arrearRemarks').value = '';
    setDefaults();
    currentEmployee = null;
    switchView('formView');
  }

  function showListView() { switchView('listView'); loadArrears(); }

  function switchView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    window.scrollTo(0, 0);
  }

  function showFormAlert(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg; el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
  }

  function showListAlert(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg; el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
  }
</script>
<script src="/js/emp-search.js?v=2"></script>
</body>
</html>
