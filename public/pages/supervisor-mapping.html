
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supervisor Mapping — Payroll System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
    .header { background: #1a73e8; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .header h1 { font-size: 20px; }
    .btn-back { background: white; color: #1a73e8; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
    .tab { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; background: white; color: #666; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .tab.active { background: #1a73e8; color: white; }
    .tab-section { display: none; }
    .tab-section.active { display: block; }
    .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 20px; }
    .card-header { padding: 15px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .card-header h3 { font-size: 15px; color: #333; }
    .card-body { padding: 20px; }
    .btn-primary { background: #1a73e8; color: white; border: none; padding: 9px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-secondary { background: #f0f2f5; color: #333; border: none; padding: 9px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-success { background: #34a853; color: white; border: none; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .btn-danger { background: #ea4335; color: white; border: none; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 13px; font-weight: 600; color: #555; }
    .form-group select, .form-group input { padding: 9px 11px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; }
    .form-group select:focus { border-color: #1a73e8; }
    .alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; display: none; }
    .alert-success { background: #e6f4ea; color: #34a853; }
    .alert-error { background: #fce8e6; color: #ea4335; }
    .empty-state { text-align: center; padding: 40px; color: #999; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #f8f9fa; padding: 12px 15px; text-align: left; font-weight: 600; color: #555; border-bottom: 1px solid #eee; }
    td { padding: 10px 15px; border-bottom: 1px solid #f5f5f5; color: #333; }
    tr:hover { background: #f8f9ff; }
    .badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-active { background: #e6f4ea; color: #34a853; }
    .badge-inactive { background: #fce8e6; color: #ea4335; }
    .stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 15px; margin-bottom: 20px; }
    .stat-card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
    .stat-card label { font-size: 12px; color: #666; display: block; margin-bottom: 5px; font-weight: 600; }
    .stat-card span { font-size: 24px; font-weight: 700; color: #1a73e8; }
    .sup-card { background: white; border-radius: 10px; padding: 15px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #1a73e8; }
    .sup-info h4 { font-size: 15px; color: #333; margin-bottom: 4px; }
    .sup-info p { font-size: 12px; color: #666; }
    .sup-stats { display: flex; gap: 20px; align-items: center; }
    .sup-stat label { font-size: 10px; color: #666; display: block; }
    .sup-stat span { font-size: 18px; font-weight: 700; color: #1a73e8; }
    .sup-dropdown { padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; outline: none; min-width: 180px; cursor: pointer; }
    .sup-dropdown:focus { border-color: #1a73e8; }
    .saved-indicator { font-size: 11px; color: #34a853; display: none; margin-left: 5px; }
    .self-badge { background: #e8f0fe; color: #1a73e8; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; margin-left: 5px; }
  </style>
</head>
<body>

<div class="header">
  <h1>🗂️ Supervisor Mapping</h1>
  <div style="display:flex;align-items:center;gap:10px;">
    <span id="headerUser" style="font-size:13px;"></span>
    <button class="btn-back" onclick="window.location.href='/dashboard'">← Dashboard</button>
  </div>
</div>

<div class="container">
  <div class="alert alert-success" id="alertSuccess"></div>
  <div class="alert alert-error" id="alertError"></div>

  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card"><label>Total Supervisors</label><span id="statTotal">0</span></div>
    <div class="stat-card"><label>Active Supervisors</label><span id="statActive" style="color:#34a853;">0</span></div>
    <div class="stat-card"><label>Mapped Employees</label><span id="statMapped">0</span></div>
    <div class="stat-card"><label>Unmapped</label><span id="statUnmapped" style="color:#ea4335;">0</span></div>
  </div>

  <!-- TABS -->
  <div style="display:flex;gap:8px;margin-bottom:20px;">
    <button class="tab active" id="tabSupervisors" onclick="switchTab('Supervisors')">👥 Supervisor List</button>
    <button class="tab" id="tabMapping" onclick="switchTab('Mapping')">🔗 Employee Mapping</button>
  </div>

  <!-- TAB 1: SUPERVISOR LIST -->
  <div class="tab-section active" id="sectionSupervisors">
    <div class="card">
      <div class="card-header">
        <h3>Supervisors</h3>
        <a href="/users" style="color:#1a73e8;font-size:13px;text-decoration:none;">+ Add Supervisor in User Management →</a>
      </div>
      <div id="supervisorList" style="padding:15px;">
        <div class="empty-state">Loading...</div>
      </div>
    </div>

    <!-- SUPERVISOR TEAM VIEW -->
    <div class="card" id="teamViewCard" style="display:none;">
      <div class="card-header">
        <div style="display:flex;align-items:center;gap:15px;">
          <h3>👥 Team of: <span id="teamSupName" style="color:#1a73e8;"></span></h3>
          <span id="teamCount" style="font-size:13px;color:#666;"></span>
        </div>
        <button class="btn-secondary" onclick="hideTeamView()">✕ Close</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>EIN</th><th>Name</th><th>Designation</th>
            <th>Location</th><th>Group</th><th>Type</th>
          </tr>
        </thead>
        <tbody id="teamTable"></tbody>
      </table>
    </div>
  </div>

  <!-- TAB 2: EMPLOYEE MAPPING -->
  <div class="tab-section" id="sectionMapping">
    <div class="card">
      <div class="card-body">
        <div style="display:flex;gap:15px;flex-wrap:wrap;align-items:end;">
          <div class="form-group">
            <label>Location</label>
            <select id="mapLocation" onchange="loadEmployeesForMapping()">
              <option value="">All Locations</option>
            </select>
          </div>
          <div class="form-group">
            <label>Section</label>
            <select id="mapSection" onchange="loadEmployeesForMapping()">
              <option value="">All Sections</option>
            </select>
          </div>
          <div class="form-group">
            <label>Profile</label>
            <select id="mapProfile" onchange="loadEmployeesForMapping()">
              <option value="">All Profiles</option>
            </select>
          </div>
          <div class="form-group">
            <label>Search</label>
            <input type="text" id="mapSearch" placeholder="EIN or Name" oninput="filterEmployeeTable()"
              style="padding:9px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none;width:200px;">
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>All Employees <span id="empCount" style="color:#666;font-weight:400;font-size:13px;"></span>
          <span id="unmappedBadge" style="background:#fce8e6;color:#ea4335;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600;margin-left:8px;display:none;"></span>
        </h3>
        <button class="btn-primary" onclick="saveAllMappings()">💾 Save Mapping</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>EIN</th>
            <th>Name</th>
            <th>Designation</th>
            <th>Location</th>
            <th>Group</th>
            <th>Supervisor</th>
          </tr>
        </thead>
        <tbody id="empMappingTable">
          <tr><td colspan="6"><div class="empty-state">Loading employees...</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let currentUser = {};
  let supervisors = [];
  let allEmployees = [];
  let filteredEmployees = [];

  window.onload = async () => {
    await checkAuth();
    await loadMasterData();
    await loadSupervisors();
    await loadEmployeesForMapping();
  };

  async function checkAuth() {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    if (!data.success) { window.location.href = '/'; return; }
    currentUser = data.user;
    document.getElementById('headerUser').textContent = data.user.fullName;
  }

  async function loadMasterData() {
    try {
      const [locRes, secRes, proRes] = await Promise.all([
        fetch('/api/masters/location'), fetch('/api/masters/section'), fetch('/api/masters/profile')
      ]);
      const [locData, secData, proData] = await Promise.all([
        locRes.json(), secRes.json(), proRes.json()
      ]);
      const locs = locData.success ? locData.masters.map(m => m.value) : [];
      const secs = secData.success ? secData.masters.map(m => m.value) : [];
      const pros = proData.success ? proData.masters.map(m => m.value) : [];
      populateSelect('mapLocation', locs, 'All Locations');
      populateSelect('mapSection', secs, 'All Sections');
      populateSelect('mapProfile', pros, 'All Profiles');
    } catch(e) {}
  }

  function populateSelect(id, values, placeholder) {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = '<option value="">' + placeholder + '</option>';
    values.forEach(v => { el.innerHTML += '<option value="' + v + '">' + v + '</option>'; });
  }

  async function loadSupervisors() {
    try {
      const res = await fetch('/api/users');
      const data = await res.json();
      if (!data.success) return;
      const role = currentUser.role;
      const level = currentUser.managementLevel;
      supervisors = data.users.filter(u => {
        if (!u.isActive) return false;
        if (role === 'admin' || (role === 'management' && level === 1)) {
          return u.role !== 'admin';
        } else if (role === 'management' && level === 2) {
          return u.role === 'supervisor' || u.role === 'accountant' || (u.role === 'management' && u.managementLevel === 3);
        } else if (role === 'accountant') {
          return u.role === 'supervisor';
        }
        return u.role === 'supervisor';
      });

      const empRes = await fetch('/api/employees');
      const empData = await empRes.json();
      const allEmp = empData.success ? empData.employees : [];
      const totalActive = allEmp.filter(e => e.isActive).length;
      const mapped = allEmp.filter(e => e.isActive && e.supervisorId).length;

      document.getElementById('statTotal').textContent = supervisors.length;
      document.getElementById('statActive').textContent = supervisors.length;
      document.getElementById('statMapped').textContent = mapped;
      document.getElementById('statUnmapped').textContent = totalActive - mapped;

      renderSupervisorList(supervisors, allEmp);
    } catch(e) { console.error(e); }
  }

  function renderSupervisorList(sups, allEmp) {
    const container = document.getElementById('supervisorList');
    if (!sups.length) {
      container.innerHTML = '<div class="empty-state">No supervisors found.<br><a href="/users" style="color:#1a73e8;">Go to User Management</a> → Add User → Role = Supervisor</div>';
      return;
    }
    container.innerHTML = sups.map(sup => {
      const mapped = allEmp.filter(e => e.isActive && e.supervisorId && e.supervisorId.toString() === sup._id.toString());
      return '<div class="sup-card">' +
        '<div class="sup-info">' +
        '<h4>' + sup.fullName + ' <span class="badge badge-active">Active</span></h4>' +
        '<p>@' + sup.username + ' | Branches: ' + (sup.branches && sup.branches.length ? sup.branches.join(', ') : 'All') + '</p>' +
        '</div>' +
        '<div class="sup-stats">' +
        '<div class="sup-stat"><label>Mapped</label><span>' + mapped.length + '</span></div>' +
        '<button class="btn-primary" style="padding:6px 14px;font-size:12px;" onclick="showTeamView(\'' + sup._id + '\',\'' + sup.fullName + '\')">' +
        '👥 View Team</button>' +
        '</div></div>';
    }).join('');
  }

  async function showTeamView(supId, supName) {
    try {
      const res = await fetch('/api/employees');
      const data = await res.json();
      if (!data.success) return;
      const allEmp = data.employees.filter(e => e.isActive);
      // Include supervisor themselves + mapped employees
      const team = allEmp.filter(e =>
        (e.supervisorId && e.supervisorId.toString() === supId) ||
        (supervisors.find(s => s._id === supId && s.fullName === e.employeeName))
      );
      document.getElementById('teamSupName').textContent = supName;
      document.getElementById('teamCount').textContent = '(' + team.length + ' members)';
      const tbody = document.getElementById('teamTable');
      if (!team.length) {
        tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state">No employees mapped to this supervisor yet</div></td></tr>';
      } else {
        const supEmp = supervisors.find(s => s._id === supId);
        tbody.innerHTML = team.map(function(emp) {
          const isSelf = supEmp && supEmp.fullName === emp.employeeName;
          const groupName = (emp.section === 'State' ? 'Xaviers' : 'Global') + ' ' + emp.profile;
          return '<tr' + (isSelf ? ' style="background:#e8f0fe;"' : '') + '>' +
            '<td><strong>' + (emp.ein||'—') + '</strong></td>' +
            '<td>' + emp.employeeName + (isSelf ? ' <span class="self-badge">SELF</span>' : '') + '</td>' +
            '<td>' + (emp.designation||'—') + '</td>' +
            '<td>' + emp.location + '</td>' +
            '<td>' + groupName + '</td>' +
            '<td>' + (isSelf ? '<span class="badge badge-active">Supervisor</span>' : '<span class="badge badge-mapped">Member</span>') + '</td>' +
            '</tr>';
        }).join('');
      }
      document.getElementById('teamViewCard').style.display = 'block';
      document.getElementById('teamViewCard').scrollIntoView({ behavior: 'smooth' });
    } catch(e) { console.error(e); }
  }

  function hideTeamView() {
    document.getElementById('teamViewCard').style.display = 'none';
  }

  async function loadEmployeesForMapping() {
    try {
      const location = document.getElementById('mapLocation').value;
      const section = document.getElementById('mapSection').value;
      const profile = document.getElementById('mapProfile').value;
      let url = '/api/employees?';
      if (location) url += 'location=' + encodeURIComponent(location) + '&';
      if (section) url += 'section=' + encodeURIComponent(section) + '&';
      if (profile) url += 'profile=' + encodeURIComponent(profile) + '&';
      const res = await fetch(url);
      const data = await res.json();
      if (!data.success) return;

      // Get staff EINs (supervisor/accountant/management) to mark or exclude
      const usersRes = await fetch('/api/users');
      const usersData = await usersRes.json();
      const staffEINs = usersData.success ?
        usersData.users.filter(u => u.role !== 'admin' && u.ein).map(u => u.ein) : [];

      const isAdmin = currentUser.role === 'admin';
      // Admin sees everyone (marked with Staff badge); others have staff excluded entirely
      allEmployees = data.employees
        .filter(e => e.isActive)
        .filter(e => isAdmin || !staffEINs.includes(e.ein))
        .map(e => ({ ...e, isStaff: staffEINs.includes(e.ein) }));
      filteredEmployees = [...allEmployees];
      renderMappingTable(filteredEmployees);
    } catch(e) { console.error(e); }
  }

  function filterEmployeeTable() {
    const search = document.getElementById('mapSearch').value.toLowerCase();
    filteredEmployees = search ? allEmployees.filter(e =>
      (e.ein && e.ein.toLowerCase().includes(search)) ||
      (e.employeeName && e.employeeName.toLowerCase().includes(search))
    ) : [...allEmployees];
    renderMappingTable(filteredEmployees);
  }

  function renderMappingTable(employees) {
    const tbody = document.getElementById('empMappingTable');
    document.getElementById('empCount').textContent = '(' + employees.length + ' employees)';
    const unmappedCount = employees.filter(e => !e.supervisorId).length;
    const badge = document.getElementById('unmappedBadge');
    if (badge) {
      if (unmappedCount > 0) {
        badge.textContent = unmappedCount + ' without supervisor';
        badge.style.display = 'inline';
      } else {
        badge.style.display = 'none';
      }
    }
    if (!employees.length) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state">No employees found</div></td></tr>';
      return;
    }

    // Build supervisor options
    const supOptions = '<option value="">-- No Supervisor --</option>' +
      supervisors.map(s => '<option value="' + s._id + '">' + s.fullName + '</option>').join('');

    tbody.innerHTML = employees.map(function(emp) {
      const currentSupId = emp.supervisorId ? emp.supervisorId.toString() : '';
      const currentSup = supervisors.find(s => s._id.toString() === currentSupId);
      // Check if this employee is a supervisor themselves
      const isSupervisor = supervisors.find(s => s.fullName === emp.employeeName);
      const groupName = (emp.section === 'State' ? 'Xaviers' : 'Global') + ' ' + emp.profile;

      return '<tr id="erow-' + emp._id + '">' +
        '<td><strong>' + (emp.ein || '—') + '</strong></td>' +
        '<td>' + emp.employeeName + (isSupervisor ? '<span class="self-badge">SUPERVISOR</span>' : '') + '</td>' +
        '<td>' + (emp.designation || '—') + '</td>' +
        '<td>' + emp.location + '</td>' +
        '<td>' + groupName + '</td>' +
        '<td>' +
          '<select class="sup-dropdown" data-emp-id="' + emp._id + '" data-emp-name="' + emp.employeeName.replace(/'/g,'') + '" onchange="markChanged(this)">' +
          supOptions +
          '</select>' +
          '<span class="saved-indicator" id="saved-' + emp._id + '">✅ Saved</span>' +
        '</td></tr>';
    }).join('');

    // Set current values after render
    employees.forEach(function(emp) {
      const sel = document.querySelector('select[data-emp-id="' + emp._id + '"]');
      if (sel && emp.supervisorId) sel.value = emp.supervisorId.toString();
    });
  }

  let changedMappings = {};

  function markChanged(selectEl) {
    const empId = selectEl.dataset.empId;
    const row = document.getElementById('erow-' + empId);
    if (row) row.style.background = '#fffde7';
    changedMappings[empId] = selectEl.value;
  }

  async function saveAllMappings() {
    const changedIds = Object.keys(changedMappings);
    if (!changedIds.length) {
      showAlert('alertError', 'No changes to save. Select supervisors first.');
      return;
    }
    let saved = 0;
    for (const empId of changedIds) {
      const supId = changedMappings[empId];
      const sup = supervisors.find(s => s._id === supId);
      try {
        const res = await fetch('/api/employees/bulk-update-supervisor', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            employeeIds: [empId],
            supervisorId: supId || null,
            supervisorName: sup ? sup.fullName : ''
          })
        });
        const data = await res.json();
        if (data.success) {
          saved++;
          const row = document.getElementById('erow-' + empId);
          if (row) row.style.background = '#e6f4ea';
          setTimeout(function() {
            if (row) row.style.background = '';
          }, 2000);
        }
      } catch(e) {}
    }
    changedMappings = {};
    showAlert('alertSuccess', '✅ Mapping saved for ' + saved + ' employees');
    await loadSupervisors();
    await loadEmployeesForMapping();
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
    document.getElementById('tab' + tab).classList.add('active');
    document.getElementById('section' + tab).classList.add('active');
  }

  function showAlert(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg; el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
  }
</script>
</body>
</html>
