<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payroll System — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo h1 {
      color: #1a73e8;
      font-size: 24px;
      font-weight: 700;
    }
    .logo p {
      color: #666;
      font-size: 14px;
      margin-top: 5px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
      outline: none;
    }
    .form-group input:focus {
      border-color: #1a73e8;
    }
    .btn-login {
      width: 100%;
      padding: 13px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn-login:hover { background: #1557b0; }
    .btn-login:disabled { background: #aaa; cursor: not-allowed; }
    .error-msg {
      background: #fce8e6;
      color: #d93025;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 15px;
      display: none;
    }
    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>🏢 Payroll System</h1>
      <p>Xaviers & Global Schools</p>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password">
    </div>
    <button class="btn-login" id="loginBtn" onclick="login()">Login</button>
    <div class="footer">Payroll Management System v1.0</div>
  </div>

  <!-- OTP FORM -->
  <div id="otpForm" style="display:none;background:white;border-radius:16px;padding:40px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,0.12);">
    <div style="text-align:center;margin-bottom:20px;">
      <div style="font-size:40px;">🔐</div>
      <h2 style="font-size:20px;color:#333;margin-top:10px;">OTP Verification</h2>
    </div>
    <p id="otpMsg" style="font-size:13px;color:#666;text-align:center;margin-bottom:20px;background:#e8f0fe;padding:12px;border-radius:8px;"></p>
    <div style="margin-bottom:15px;">
      <label style="font-size:13px;font-weight:600;color:#333;display:block;margin-bottom:6px;">Enter 6-digit OTP</label>
      <input type="text" id="otpInput" placeholder="e.g. 123456" maxlength="6"
        style="width:100%;padding:14px;border:2px solid #1a73e8;border-radius:8px;font-size:20px;text-align:center;letter-spacing:8px;outline:none;">
    </div>
    <div id="otpError" style="display:none;color:#ea4335;font-size:13px;background:#fce8e6;padding:10px;border-radius:6px;margin-bottom:10px;"></div>
    <button id="otpBtn" onclick="verifyOTP()"
      style="width:100%;padding:14px;background:#1a73e8;color:white;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;">
      Verify OTP
    </button>
    <button onclick="window.location.reload()"
      style="width:100%;padding:10px;background:none;color:#666;border:none;font-size:13px;cursor:pointer;margin-top:10px;">
      ← Back to Login
    </button>
  </div>

  <script>
    // Check if already logged in
    fetch('/api/auth/me')
      .then(res => res.json())
      .then(data => {
        if (data.success) window.location.href = '/dashboard';
      });

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      const loginBtn = document.getElementById('loginBtn');

      if (!username || !password) {
        errorMsg.textContent = 'Please enter username and password';
        errorMsg.style.display = 'block';
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';
      errorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/dashboard';
        } else if (data.otpRequired) {
          // Show OTP screen for accountant
          document.getElementById('loginForm').style.display = 'none';
          document.getElementById('otpForm').style.display = 'block';
          document.getElementById('otpMsg').textContent = data.message;
          document.getElementById('otpInput').focus();
        } else {
          errorMsg.textContent = data.message;
          errorMsg.style.display = 'block';
          loginBtn.disabled = false;
          loginBtn.textContent = 'Login';
        }
      } catch (err) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    }

    // Allow Enter key to login
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const otpForm = document.getElementById('otpForm');
        if (otpForm && otpForm.style.display !== 'none') {
          verifyOTP();
        } else {
          login();
        }
      }
    });

    async function verifyOTP() {
      const code = document.getElementById('otpInput').value.trim();
      const otpError = document.getElementById('otpError');
      const otpBtn = document.getElementById('otpBtn');
      if (!code || code.length !== 6) {
        otpError.textContent = 'Please enter the 6-digit OTP';
        otpError.style.display = 'block';
        return;
      }
      otpBtn.disabled = true;
      otpBtn.textContent = 'Verifying...';
      otpError.style.display = 'none';
      try {
        const res = await fetch('/api/auth/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/dashboard';
        } else {
          otpError.textContent = data.message;
          otpError.style.display = 'block';
          otpBtn.disabled = false;
          otpBtn.textContent = 'Verify OTP';
        }
      } catch(e) {
        otpError.textContent = 'Connection error. Please try again.';
        otpError.style.display = 'block';
        otpBtn.disabled = false;
        otpBtn.textContent = 'Verify OTP';
      }
    }
  </script>
</body>
</html>
